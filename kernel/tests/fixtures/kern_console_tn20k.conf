# kern.conf — tn20k variant of kern_console.conf: /bin/console (portrait)
# plus a UART shell. Used by disk-console-tn20k.img → tn20k_kernel_console.bin.
init=/bin/console
#
# A UART shell runs alongside: on tn20k (and the web emulator) /dev/kbd
# is the GPIO matrix, so console's nested sh reads the matrix and this
# sh reads UART RX — no contention. qemu virt (test_os) boots the shared
# disk-console*.img instead, where /dev/kbd is the UART-RX stub and a
# second sh would steal console's input.
init=/bin/sh
