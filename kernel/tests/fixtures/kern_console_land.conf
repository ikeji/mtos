# kern.conf — seeds /bin/console in landscape mode at boot.
#
# Identical to kern_console.conf except the init line carries an
# argument: `/bin/console -l` selects landscape orientation, which
# uses software scrolling. Exercises kern.conf's init-argument support
# (the value after `init=` is split on whitespace into path + argv).
init=/bin/console -l
#
# A UART shell runs alongside: /dev/kbd is the GPIO matrix on every
# platform that boots this disk (tn20k, pico2, the web emulator), so
# console's nested sh reads the matrix and this sh reads UART RX —
# no contention (qemu virt, where /dev/kbd is the UART-RX stub, never
# boots the console disks; test_os runs `console` from a UART sh).
init=/bin/sh
