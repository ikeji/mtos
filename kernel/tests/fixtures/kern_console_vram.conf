# kern.conf — seeds /bin/console in landscape + VRAM-engine mode at boot.
#
# tn20k standalone only. `/bin/console -l -v` selects landscape AND the
# hardware VRAM refresh engine (hw/rtl/soc/vram_lcd.v): the console pokes
# pixels into an SDRAM framebuffer and the engine streams it to the LCD,
# so the CPU never drives the panel during rendering. DO NOT use this on
# pico2 — it has no VRAM engine and the framebuffer address (0x807A5000)
# is not backed by RAM there. pico2 keeps kern_console_land.conf (-l only).
init=/bin/console -l -v
#
# A UART shell runs alongside: this disk is tn20k-only (and the web
# emulator), where /dev/kbd is the GPIO matrix, so console's nested sh
# reads the matrix and this sh reads UART RX — no contention.
init=/bin/sh
