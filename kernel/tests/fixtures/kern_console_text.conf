# kern.conf — seeds /bin/console in hw text-mode at boot (tn20k standalone).
#
# `/bin/console -t` uses the hardware text_lcd character-generator engine
# (hw/rtl/soc/text_lcd.v): the console writes a 60x20 cell grid over MMIO and
# the engine expands an on-chip hankaku font to the ILI9488 itself — no glyph
# expansion, no pixel writes, no SDRAM. DO NOT use on pico2 (no text engine).
init=/bin/console -t
